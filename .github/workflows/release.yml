name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic.outputs.released }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: ./package.json

      - name: Install dependencies
        run: npm install

      - name: Debug workspace
        run: |
          pwd
          ls -la
          ls -la scripts || true
          find . -name "update-manifest.js"
          git rev-parse HEAD
          git status

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npx semantic-release
          if [ -f .semantic-release-success ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  publish-firefox:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/publish-firefox.yml
    secrets: inherit
